display_errors=Off
log_errors=On
html_errors=Off
expose_php=Off
error_log=../../ideamos-contact/php-error.log
max_execution_time=15
max_input_time=15
memory_limit=64M
post_max_size=32K
upload_max_filesize=32K
max_input_vars=32
session.use_strict_mode=1
session.cookie_httponly=1
session.cookie_secure=1
zend.exception_ignore_args=On
